<div class="dsa20-demo" id="dsa20-demo">
  <style>
    .dsa20-demo { margin: 1.25rem 0; padding: 1rem 1.1rem; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); font-size: 0.85rem; }
    .dsa20-demo .dsa20-tabs { display: flex; gap: 0.45rem; margin-bottom: 0.75rem; }
    .dsa20-demo .dsa20-tab { padding: 0.35rem 0.8rem; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--card-bg); cursor: pointer; font-size: 0.82rem; }
    .dsa20-demo .dsa20-tab.is-active { background: var(--accent); color: #fff; }
    .dsa20-demo .dsa20-tree { display: flex; flex-direction: column; align-items: center; gap: 8px; margin: 0.5rem 0; }
    .dsa20-demo .dsa20-level { display: flex; gap: 16px; }
    .dsa20-demo .dsa20-node { width: 2.25rem; height: 2.25rem; border-radius: 50%; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-family: monospace; font-weight: 600; background: var(--card-bg); font-size: 0.82rem; transition: all 0.2s; }
    .dsa20-demo .dsa20-node.is-visited { background: var(--accent-light); border-color: var(--accent); }
    .dsa20-demo .dsa20-node.is-current { background: var(--accent); color: #fff; }
    .dsa20-demo .dsa20-order { margin-top: 0.35rem; font-family: monospace; font-size: 0.78rem; color: var(--text-muted); }
    .dsa20-demo .dsa20-controls { margin-top: 0.85rem; display: flex; gap: 0.45rem; flex-wrap: wrap; }
    .dsa20-demo .dsa20-btn { padding: 0.35rem 0.8rem; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--card-bg); cursor: pointer; font-size: 0.82rem; }
    .dsa20-demo .dsa20-hint { margin-top: 0.6rem; color: var(--text-muted); font-size: 0.82rem; line-height: 1.5; }
  </style>
  <div class="dsa20-tabs">
    <button type="button" class="dsa20-tab is-active" data-mode="dfs">DFS (Pre-order)</button>
    <button type="button" class="dsa20-tab" data-mode="bfs">BFS (Level-order)</button>
  </div>
  <div class="dsa20-tree" id="dsa20-tree"></div>
  <div class="dsa20-order" id="dsa20-order"></div>
  <div class="dsa20-controls">
    <button type="button" class="dsa20-btn" id="dsa20-prev">← Trước</button>
    <button type="button" class="dsa20-btn" id="dsa20-next">Tiếp →</button>
    <button type="button" class="dsa20-btn" id="dsa20-play">▶ Tự chạy</button>
  </div>
  <div class="dsa20-hint" id="dsa20-hint"></div>
  <script>
  (function () {
    var tree = [[4], [2, 6], [1, 3, 5, 7]];
    var dfsSteps = [
      { curr: 4, visited: [4], order: [4], hint: 'DFS Pre-order: visit root trước, rồi left, right.' },
      { curr: 2, visited: [4, 2], order: [4, 2], hint: 'Visit 2, đi left subtree.' },
      { curr: 1, visited: [4, 2, 1], order: [4, 2, 1], hint: 'Visit 1 (leaf). Backtrack → 3.' },
      { curr: 3, visited: [4, 2, 1, 3], order: [4, 2, 1, 3], hint: 'Visit 3. Pre-order hoàn thành left subtree.' }
    ];
    var bfsSteps = [
      { curr: 4, visited: [4], order: [4], hint: 'BFS: Queue=[4]. Dequeue 4, enqueue children 2,6.' },
      { curr: 2, visited: [4, 2], order: [4, 2], hint: 'Dequeue 2, enqueue 1,3. Level-by-level.' },
      { curr: 6, visited: [4, 2, 6], order: [4, 2, 6], hint: 'Dequeue 6, enqueue 5,7.' },
      { curr: 1, visited: [4, 2, 6, 1], order: [4, 2, 6, 1], hint: 'BFS dùng Queue. DFS dùng Stack (hoặc recursion).' }
    ];
    var mode = 'dfs', pos = 0, timer = null;
    function steps() { return mode === 'dfs' ? dfsSteps : bfsSteps; }
    function allNodes() {
      var ns = [];
      tree.forEach(function(l) { l.forEach(function(v) { if (v !== null) ns.push(v); }); });
      return ns;
    }
    function render() {
      var s = steps()[pos];
      document.getElementById('dsa20-tree').innerHTML = tree.map(function(lev) {
        return '<div class="dsa20-level">' + lev.map(function(v) {
          if (v === null) return '<div class="dsa20-node" style="visibility:hidden">·</div>';
          var cls = 'dsa20-node';
          if (v === s.curr) cls += ' is-current';
          else if (s.visited.indexOf(v) >= 0) cls += ' is-visited';
          return '<div class="' + cls + '">' + v + '</div>';
        }).join('') + '</div>';
      }).join('');
      document.getElementById('dsa20-order').textContent = 'Order: [' + s.order.join(', ') + ']';
      document.getElementById('dsa20-hint').textContent = 'Bước ' + (pos+1) + '/' + steps().length + ' · ' + s.hint;
    }
    function stopPlay() { if (timer) { clearInterval(timer); timer = null; } document.getElementById('dsa20-play').textContent = '▶ Tự chạy'; }
    document.querySelectorAll('.dsa20-tab').forEach(function(btn) {
      btn.onclick = function () {
        mode = btn.dataset.mode;
        document.querySelectorAll('.dsa20-tab').forEach(function(b) { b.classList.toggle('is-active', b === btn); });
        pos = 0; stopPlay(); render();
      };
    });
    document.getElementById('dsa20-prev').onclick = function () { stopPlay(); pos = Math.max(0, pos-1); render(); };
    document.getElementById('dsa20-next').onclick = function () { stopPlay(); pos = Math.min(steps().length-1, pos+1); render(); };
    document.getElementById('dsa20-play').onclick = function () {
      if (timer) { stopPlay(); return; }
      document.getElementById('dsa20-play').textContent = '⏸ Dừng';
      timer = setInterval(function () { pos = pos >= steps().length-1 ? 0 : pos+1; render(); }, 1400);
    };
    render();
  })();
  </script>
</div>
