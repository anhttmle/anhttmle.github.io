<div class="dsa14-demo" id="dsa14-demo">
  <style>
    .dsa14-demo { margin: 1.25rem 0; padding: 1rem 1.1rem; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); font-size: 0.85rem; }
    .dsa14-demo .dsa14-track { display: flex; gap: 4px; flex-wrap: wrap; margin: 0.5rem 0; }
    .dsa14-demo .dsa14-cell { width: 2.25rem; height: 2.25rem; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border); border-radius: 4px; background: var(--card-bg); font-family: monospace; font-weight: 600; font-size: 0.82rem; }
    .dsa14-demo .dsa14-cell.is-window { background: var(--accent-light); border-color: var(--accent); }
    .dsa14-demo .dsa14-controls { margin-top: 0.85rem; display: flex; gap: 0.45rem; flex-wrap: wrap; }
    .dsa14-demo .dsa14-btn { padding: 0.35rem 0.8rem; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--card-bg); cursor: pointer; font-size: 0.82rem; }
    .dsa14-demo .dsa14-hint { margin-top: 0.6rem; color: var(--text-muted); font-size: 0.82rem; line-height: 1.5; }
    .dsa14-demo .dsa14-formula { margin-top: 0.35rem; font-family: monospace; font-size: 0.78rem; }
  </style>
  <div class="dsa14-track" id="dsa14-array"></div>
  <div class="dsa14-controls">
    <button type="button" class="dsa14-btn" id="dsa14-prev">← Trước</button>
    <button type="button" class="dsa14-btn" id="dsa14-next">Tiếp →</button>
    <button type="button" class="dsa14-btn" id="dsa14-play">▶ Tự chạy</button>
  </div>
  <div class="dsa14-hint" id="dsa14-hint"></div>
  <div class="dsa14-formula" id="dsa14-formula"></div>
  <script>
  (function () {
    var arr = [2, 1, 5, 1, 3, 2]; var k = 3;
    var steps = [
      { start: 0, hint: 'Window [0..2]: sum=2+1+5=8', sum: 8 },
      { start: 1, hint: 'Slide: bỏ arr[0], thêm arr[3]. sum=8-2+1=7', sum: 7 },
      { start: 2, hint: 'Window [2..4]: sum=5+1+3=9', sum: 9 },
      { start: 3, hint: 'Window [3..5]: sum=1+3+2=6. Max sum k=3 → 9', sum: 6 }
    ];
    var pos = 0, timer = null;
    function render() {
      var s = steps[pos];
      document.getElementById('dsa14-array').innerHTML = arr.map(function(v,i) {
        var inW = i >= s.start && i < s.start + k;
        return '<div class="dsa14-cell' + (inW ? ' is-window' : '') + '">' + v + '</div>';
      }).join('');
      document.getElementById('dsa14-hint').textContent = 'Bước ' + (pos+1) + '/' + steps.length + ' · ' + s.hint;
      document.getElementById('dsa14-formula').textContent = 'window size k=' + k + ', sum=' + s.sum;
    }
    function stopPlay() { if (timer) { clearInterval(timer); timer = null; } document.getElementById('dsa14-play').textContent = '▶ Tự chạy'; }
    document.getElementById('dsa14-prev').onclick = function () { stopPlay(); pos = Math.max(0, pos-1); render(); };
    document.getElementById('dsa14-next').onclick = function () { stopPlay(); pos = Math.min(steps.length-1, pos+1); render(); };
    document.getElementById('dsa14-play').onclick = function () {
      if (timer) { stopPlay(); return; }
      document.getElementById('dsa14-play').textContent = '⏸ Dừng';
      timer = setInterval(function () { pos = pos >= steps.length-1 ? 0 : pos+1; render(); }, 1300);
    };
    render();
  })();
  </script>
</div>
