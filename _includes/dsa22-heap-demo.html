<div class="dsa22-demo" id="dsa22-demo">
  <style>
    .dsa22-demo { margin: 1.25rem 0; padding: 1rem 1.1rem; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); font-size: 0.85rem; }
    .dsa22-demo .dsa22-heap { display: flex; flex-direction: column; align-items: center; gap: 6px; margin: 0.5rem 0; }
    .dsa22-demo .dsa22-level { display: flex; gap: 10px; }
    .dsa22-demo .dsa22-node { width: 2.25rem; height: 2.25rem; border-radius: 50%; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-family: monospace; font-weight: 600; background: var(--card-bg); font-size: 0.82rem; transition: all 0.2s; }
    .dsa22-demo .dsa22-node.is-swap { background: #fef3c7; border-color: #f59e0b; }
    .dsa22-demo .dsa22-node.is-new { background: var(--accent); color: #fff; }
    .dsa22-demo .dsa22-controls { margin-top: 0.85rem; display: flex; gap: 0.45rem; flex-wrap: wrap; }
    .dsa22-demo .dsa22-btn { padding: 0.35rem 0.8rem; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--card-bg); cursor: pointer; font-size: 0.82rem; }
    .dsa22-demo .dsa22-hint { margin-top: 0.6rem; color: var(--text-muted); font-size: 0.82rem; line-height: 1.5; }
    @media (prefers-color-scheme: dark) { .dsa22-demo .dsa22-node.is-swap { background: #451a03; border-color: #f59e0b; color: #fde68a; } }
  </style>
  <div class="dsa22-heap" id="dsa22-heap"></div>
  <div class="dsa22-controls">
    <button type="button" class="dsa22-btn" id="dsa22-prev">← Trước</button>
    <button type="button" class="dsa22-btn" id="dsa22-next">Tiếp →</button>
    <button type="button" class="dsa22-btn" id="dsa22-play">▶ Tự chạy</button>
  </div>
  <div class="dsa22-hint" id="dsa22-hint"></div>
  <script>
  (function () {
    var steps = [
      { heap: [1, 3, 5, 7, 9], swap: [], newVal: -1, hint: 'Min Heap: parent ≤ children. Array: [1,3,5,7,9].' },
      { heap: [1, 3, 5, 7, 9, 2], swap: [], newVal: 2, hint: 'push(2): thêm cuối array, bubble up.' },
      { heap: [1, 2, 5, 7, 9, 3], swap: [1, 5], newVal: 2, hint: '2 < parent 3 → swap. 2 < parent 1? No. Done.' },
      { heap: [2, 3, 5, 7, 9], swap: [0, 0], newVal: -1, hint: 'pop(): swap root với last, bubble down. O(log n).' }
    ];
    steps[3].heap = [2, 3, 5, 7, 9];
    var pos = 0, timer = null;
    function renderHeap(arr, swapIdx, newV) {
      var levels = [[0], [1, 2], [3, 4]];
      if (arr.length > 5) levels = [[0], [1, 2], [3, 4, 5]];
      return levels.map(function(lev) {
        return '<div class="dsa22-level">' + lev.map(function(i) {
          if (i >= arr.length) return '<div class="dsa22-node" style="visibility:hidden">·</div>';
          var cls = 'dsa22-node';
          if (swapIdx.indexOf(i) >= 0) cls += ' is-swap';
          if (arr[i] === newV && newV >= 0) cls += ' is-new';
          return '<div class="' + cls + '">' + arr[i] + '</div>';
        }).join('') + '</div>';
      }).join('');
    }
    function render() {
      var s = steps[pos];
      document.getElementById('dsa22-heap').innerHTML = renderHeap(s.heap, s.swap, s.newVal);
      document.getElementById('dsa22-hint').textContent = 'Bước ' + (pos+1) + '/' + steps.length + ' · ' + s.hint;
    }
    function stopPlay() { if (timer) { clearInterval(timer); timer = null; } document.getElementById('dsa22-play').textContent = '▶ Tự chạy'; }
    document.getElementById('dsa22-prev').onclick = function () { stopPlay(); pos = Math.max(0, pos-1); render(); };
    document.getElementById('dsa22-next').onclick = function () { stopPlay(); pos = Math.min(steps.length-1, pos+1); render(); };
    document.getElementById('dsa22-play').onclick = function () {
      if (timer) { stopPlay(); return; }
      document.getElementById('dsa22-play').textContent = '⏸ Dừng';
      timer = setInterval(function () { pos = pos >= steps.length-1 ? 0 : pos+1; render(); }, 1500);
    };
    render();
  })();
  </script>
</div>
