<div class="dsa18-demo" id="dsa18-demo">
  <style>
    .dsa18-demo { margin: 1.25rem 0; padding: 1rem 1.1rem; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); font-size: 0.85rem; }
    .dsa18-demo .dsa18-tree { display: flex; flex-direction: column; align-items: center; gap: 8px; margin: 0.5rem 0; }
    .dsa18-demo .dsa18-level { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .dsa18-demo .dsa18-node { width: 2.25rem; height: 2.25rem; border-radius: 50%; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-family: monospace; font-weight: 600; background: var(--card-bg); font-size: 0.82rem; }
    .dsa18-demo .dsa18-node.is-root { border-color: var(--accent); background: var(--accent-light); }
    .dsa18-demo .dsa18-node.is-leaf { border-style: dashed; opacity: 0.85; }
    .dsa18-demo .dsa18-node.is-highlight { background: var(--accent); color: #fff; border-color: var(--accent-dark); }
    .dsa18-demo .dsa18-controls { margin-top: 0.85rem; display: flex; gap: 0.45rem; flex-wrap: wrap; }
    .dsa18-demo .dsa18-btn { padding: 0.35rem 0.8rem; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--card-bg); cursor: pointer; font-size: 0.82rem; }
    .dsa18-demo .dsa18-hint { margin-top: 0.6rem; color: var(--text-muted); font-size: 0.82rem; line-height: 1.5; }
  </style>
  <div class="dsa18-tree" id="dsa18-tree"></div>
  <div class="dsa18-controls">
    <button type="button" class="dsa18-btn" id="dsa18-prev">← Trước</button>
    <button type="button" class="dsa18-btn" id="dsa18-next">Tiếp →</button>
    <button type="button" class="dsa18-btn" id="dsa18-play">▶ Tự chạy</button>
  </div>
  <div class="dsa18-hint" id="dsa18-hint"></div>
  <script>
  (function () {
    var levels = [[8], [3, 10], [1, 6, null, 14], [null, null, 4, 7, null, null, 13, null]];
    var steps = [
      { hi: 8, hint: 'Root=8. Binary Tree: mỗi node tối đa 2 children (left, right).' },
      { hi: 3, hint: 'Left subtree root=3. Height=3, depth của node 4 = 3.' },
      { hi: 14, hint: 'Right subtree root=10→14. Leaf nodes (1,4,7,13) không có con.' },
      { hi: 6, hint: 'Tree vs Graph: tree không có cycle, connected, n-1 edges.' }
    ];
    var pos = 0, timer = null;
    function render() {
      var s = steps[pos];
      document.getElementById('dsa18-tree').innerHTML = levels.map(function(lev, li) {
        return '<div class="dsa18-level">' + lev.map(function(v) {
          if (v === null) return '<div class="dsa18-node" style="visibility:hidden">·</div>';
          var cls = 'dsa18-node';
          if (li === 0) cls += ' is-root';
          if (li === 3) cls += ' is-leaf';
          if (v === s.hi) cls += ' is-highlight';
          return '<div class="' + cls + '">' + v + '</div>';
        }).join('') + '</div>';
      }).join('');
      document.getElementById('dsa18-hint').textContent = 'Bước ' + (pos+1) + '/' + steps.length + ' · ' + s.hint;
    }
    function stopPlay() { if (timer) { clearInterval(timer); timer = null; } document.getElementById('dsa18-play').textContent = '▶ Tự chạy'; }
    document.getElementById('dsa18-prev').onclick = function () { stopPlay(); pos = Math.max(0, pos-1); render(); };
    document.getElementById('dsa18-next').onclick = function () { stopPlay(); pos = Math.min(steps.length-1, pos+1); render(); };
    document.getElementById('dsa18-play').onclick = function () {
      if (timer) { stopPlay(); return; }
      document.getElementById('dsa18-play').textContent = '⏸ Dừng';
      timer = setInterval(function () { pos = pos >= steps.length-1 ? 0 : pos+1; render(); }, 1400);
    };
    render();
  })();
  </script>
</div>
