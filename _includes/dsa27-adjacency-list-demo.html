<div class="dsa27-demo" id="dsa27-demo">
  <style>
    .dsa27-demo { margin: 1.25rem 0; padding: 1rem 1.1rem; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); font-size: 0.85rem; }
    .dsa27-demo .dsa27-layout { display: flex; gap: 1.5rem; flex-wrap: wrap; margin: 0.5rem 0; }
    .dsa27-demo .dsa27-nodes { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .dsa27-demo .dsa27-node { width: 2rem; height: 2rem; border-radius: 50%; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-family: monospace; font-weight: 600; background: var(--card-bg); font-size: 0.82rem; }
    .dsa27-demo .dsa27-node.is-visited { background: var(--accent-light); border-color: var(--accent); }
    .dsa27-demo .dsa27-node.is-curr { background: var(--accent); color: #fff; }
    .dsa27-demo .dsa27-adj { flex: 1; min-width: 180px; }
    .dsa27-demo .dsa27-row { font-family: monospace; font-size: 0.78rem; margin: 0.25rem 0; padding: 0.25rem 0.5rem; border-radius: 4px; }
    .dsa27-demo .dsa27-row.is-active { background: var(--accent-light); }
    .dsa27-demo .dsa27-controls { margin-top: 0.85rem; display: flex; gap: 0.45rem; flex-wrap: wrap; }
    .dsa27-demo .dsa27-btn { padding: 0.35rem 0.8rem; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--card-bg); cursor: pointer; font-size: 0.82rem; }
    .dsa27-demo .dsa27-hint { margin-top: 0.6rem; color: var(--text-muted); font-size: 0.82rem; line-height: 1.5; }
  </style>
  <div class="dsa27-layout">
    <div class="dsa27-nodes" id="dsa27-nodes"></div>
    <div class="dsa27-adj" id="dsa27-adj"></div>
  </div>
  <div class="dsa27-controls">
    <button type="button" class="dsa27-btn" id="dsa27-prev">← Trước</button>
    <button type="button" class="dsa27-btn" id="dsa27-next">Tiếp →</button>
    <button type="button" class="dsa27-btn" id="dsa27-play">▶ Tự chạy</button>
  </div>
  <div class="dsa27-hint" id="dsa27-hint"></div>
  <script>
  (function () {
    var adj = { 0: [1, 2], 1: [0, 3], 2: [0, 3], 3: [1, 2] };
    var steps = [
      { visited: [], curr: -1, activeRow: -1, hint: 'Adjacency List: mỗi node → list neighbors. Space O(V+E).' },
      { visited: [0], curr: 0, activeRow: 0, hint: 'BFS từ node 0. Queue=[0]. Adj[0]=[1,2].' },
      { visited: [0, 1, 2], curr: 1, activeRow: 1, hint: 'Dequeue 0, enqueue 1,2. Visit neighbors qua adj list.' },
      { visited: [0, 1, 2, 3], curr: 3, activeRow: 3, hint: 'Dequeue 1 → neighbor 3. Graph traversal O(V+E).' }
    ];
    var pos = 0, timer = null;
    function render() {
      var s = steps[pos];
      document.getElementById('dsa27-nodes').innerHTML = [0,1,2,3].map(function(n) {
        var cls = 'dsa27-node';
        if (s.visited.indexOf(n) >= 0) cls += ' is-visited';
        if (n === s.curr) cls += ' is-curr';
        return '<div class="' + cls + '">' + n + '</div>';
      }).join('');
      document.getElementById('dsa27-adj').innerHTML = Object.keys(adj).map(function(k) {
        return '<div class="dsa27-row' + (parseInt(k) === s.activeRow ? ' is-active' : '') + '">' + k + ' → [' + adj[k].join(', ') + ']</div>';
      }).join('');
      document.getElementById('dsa27-hint').textContent = 'Bước ' + (pos+1) + '/' + steps.length + ' · ' + s.hint;
    }
    function stopPlay() { if (timer) { clearInterval(timer); timer = null; } document.getElementById('dsa27-play').textContent = '▶ Tự chạy'; }
    document.getElementById('dsa27-prev').onclick = function () { stopPlay(); pos = Math.max(0, pos-1); render(); };
    document.getElementById('dsa27-next').onclick = function () { stopPlay(); pos = Math.min(steps.length-1, pos+1); render(); };
    document.getElementById('dsa27-play').onclick = function () {
      if (timer) { stopPlay(); return; }
      document.getElementById('dsa27-play').textContent = '⏸ Dừng';
      timer = setInterval(function () { pos = pos >= steps.length-1 ? 0 : pos+1; render(); }, 1500);
    };
    render();
  })();
  </script>
</div>
