<div class="dsa02-demo" id="dsa02-demo">
  <style>
    .dsa02-demo {
      margin: 1.25rem 0; padding: 1rem 1.1rem;
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: var(--bg); font-size: 0.85rem;
    }
    .dsa02-demo .dsa02-title {
      font-size: 0.78rem; font-weight: 600; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.04em; margin: 0.75rem 0 0.35rem;
    }
    .dsa02-demo .dsa02-title:first-child { margin-top: 0; }
    .dsa02-demo .dsa02-track { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
    .dsa02-demo .dsa02-cell {
      width: 2.25rem; height: 2.25rem; display: flex; align-items: center;
      justify-content: center; border: 1px solid var(--border); border-radius: 4px;
      background: var(--card-bg); font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.82rem; font-weight: 600; transition: all 0.2s;
    }
    .dsa02-demo .dsa02-cell.is-new { background: #fef3c7; border-color: #f59e0b; color: #92400e; }
    .dsa02-demo .dsa02-cell.is-copy { background: var(--accent-light); border-color: var(--accent); }
    .dsa02-demo .dsa02-cell.is-empty { opacity: 0.3; border-style: dashed; }
    .dsa02-demo .dsa02-controls { margin-top: 0.85rem; display: flex; gap: 0.45rem; flex-wrap: wrap; }
    .dsa02-demo .dsa02-btn {
      padding: 0.35rem 0.8rem; border-radius: var(--radius-sm);
      border: 1px solid var(--border); background: var(--card-bg);
      font-size: 0.82rem; cursor: pointer;
    }
    .dsa02-demo .dsa02-btn:hover { border-color: var(--accent); color: var(--accent); }
    .dsa02-demo .dsa02-btn.is-active { background: var(--accent); color: #fff; }
    .dsa02-demo .dsa02-hint { margin-top: 0.6rem; color: var(--text-muted); font-size: 0.82rem; line-height: 1.5; }
    .dsa02-demo .dsa02-formula { margin-top: 0.35rem; font-family: ui-monospace, monospace; font-size: 0.78rem; }
    @media (prefers-color-scheme: dark) {
      .dsa02-demo .dsa02-cell.is-new { background: #451a03; border-color: #f59e0b; color: #fde68a; }
    }
  </style>

  <div class="dsa02-title">Dynamic Array (capacity vs size)</div>
  <div class="dsa02-track" id="dsa02-array"></div>
  <div class="dsa02-controls">
    <button type="button" class="dsa02-btn" id="dsa02-prev">← Trước</button>
    <button type="button" class="dsa02-btn" id="dsa02-next">Tiếp →</button>
    <button type="button" class="dsa02-btn" id="dsa02-play">▶ Tự chạy</button>
  </div>
  <div class="dsa02-hint" id="dsa02-hint"></div>
  <div class="dsa02-formula" id="dsa02-formula"></div>

  <script>
  (function () {
    var steps = [
      { cap: 4, data: [1, 2, 3], newIdx: -1, hint: 'size=3, capacity=4. Còn chỗ trống, append O(1).', formula: 'append(4) → chưa cần resize' },
      { cap: 4, data: [1, 2, 3, 4], newIdx: 3, hint: 'append(4): size=4 = capacity. Mảng đầy!', formula: 'size == capacity → cần resize' },
      { cap: 8, data: [1, 2, 3, 4], newIdx: -1, hint: 'Resize: cấp phát mảng mới capacity=8, copy 4 phần tử. O(n).', formula: 'new_capacity = old × 2 = 8' },
      { cap: 8, data: [1, 2, 3, 4, 5], newIdx: 4, hint: 'append(5) sau resize: O(1). Amortized O(1) cho append.', formula: 'append amortized = O(1)' }
    ];
    var pos = 0, timer = null;
    var arrEl = document.getElementById('dsa02-array');
    var hintEl = document.getElementById('dsa02-hint');
    var formulaEl = document.getElementById('dsa02-formula');
    var playBtn = document.getElementById('dsa02-play');

    function render() {
      var s = steps[pos];
      arrEl.innerHTML = '';
      for (var i = 0; i < s.cap; i++) {
        var cls = 'dsa02-cell';
        if (i >= s.data.length) cls += ' is-empty';
        else if (i === s.newIdx) cls += ' is-new';
        else if (pos === 2 && i < s.data.length) cls += ' is-copy';
        arrEl.innerHTML += '<div class="' + cls + '">' + (i < s.data.length ? s.data[i] : '·') + '</div>';
      }
      hintEl.textContent = 'Bước ' + (pos + 1) + '/' + steps.length + ' · ' + s.hint;
      formulaEl.textContent = s.formula + ' · size=' + s.data.length + ', capacity=' + s.cap;
    }

    function stopPlay() {
      if (timer) { clearInterval(timer); timer = null; }
      playBtn.classList.remove('is-active'); playBtn.textContent = '▶ Tự chạy';
    }
    document.getElementById('dsa02-prev').onclick = function () { stopPlay(); pos = Math.max(0, pos - 1); render(); };
    document.getElementById('dsa02-next').onclick = function () { stopPlay(); pos = Math.min(steps.length - 1, pos + 1); render(); };
    playBtn.onclick = function () {
      if (timer) { stopPlay(); return; }
      playBtn.classList.add('is-active'); playBtn.textContent = '⏸ Dừng';
      timer = setInterval(function () { pos = pos >= steps.length - 1 ? 0 : pos + 1; render(); }, 1400);
    };
    render();
  })();
  </script>
</div>
